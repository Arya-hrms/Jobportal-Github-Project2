<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job</title>
    <style>
        /* Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Form Wrapper Container */
        .form-wrapper {
            width: 100%;
            max-width: 550px;
        }

        /* Job Post Form Styling */
        .job-post-form {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .job-post-form h2 {
            font-size: 2rem;
            color: #1e1b4b;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .form-subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Form Group Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #7c3aed;
            background: #fff;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.15);
        }

        /* Group 2 inputs side by side */
        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* Colorful Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #fff;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="form-wrapper">
        <form class="job-post-form"  method="POST">
        {% csrf_token %}
      <!-- Django Messages -->
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message {% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            <h2>✨ Post a New Job</h2>
            <p class="form-subtitle">Fill in the details below to publish your opening.</p>

            <!-- Job Title -->
            <div class="form-group">
                <label for="job-title">Job Title</label>
                <input type="text" id="job-title" name="title" placeholder="e.g. Frontend Developer" required>
            </div>

            <!-- Company Name -->
            <div class="form-group">
                <label for="company-name">Company Name</label>
                <input type="text" id="company-name" name="company" placeholder="e.g. Tech Corp" required>
            </div>

            <!-- Job Type & Last Date Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="job-type">Job Type</label>
                    <select id="job-type" name="jobtype" required>
                        <option value="" disabled selected>Select type</option>
                        <option value="full-time">Full-Time</option>
                        <option value="part-time">Part-Time</option>
                        <option value="contract">Contract</option>
                        <option value="internship">Internship</option>
                        <option value="remote">Remote</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="last-date">Last Date to Apply</label>
                    <input type="date" id="last-date" name="lastdate" required>
                </div>
            </div>

            <!-- Location -->
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="e.g. Kochi, Kerala (Remote / Hybrid)" required>
            </div>

            <!-- Skills -->
            <div class="form-group">
                <label for="skills">Skills</label>
                <input type="text" id="skills" name="required_skills" placeholder="e.g. HTML, CSS, JavaScript, React" required>
            </div>

            <!-- Experience & Education Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="experience">Experience</label>
                    <input type="text" id="experience" name="experience" placeholder="e.g. 2-4 Years" required>
                </div>

                <div class="form-group">
                    <label for="education">Education</label>
                    <input type="text" id="education" name="education" placeholder="e.g. Bachelor's Degree" required>
                </div>
            </div>

            <!-- Salary -->
            <div class="form-group">
                <label for="salary">Salary</label>
                <input type="text" id="salary" name="salary" placeholder="e.g. $60,000 - $80,000 / year" required>
            </div>

            <!-- Job Description -->
            <div class="form-group">
                <label for="description">Job Description</label>
                <textarea id="description" name="description" placeholder="Provide a detailed description of the job role, responsibilities, and requirements..." required></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Publish Job</button>
        </form>
    </div>

</body>
</html>
