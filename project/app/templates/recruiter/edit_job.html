<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job</title>

    <style>

        /* Reset & Global Styles */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(
                135deg,
                #4f46e5 0%,
                #7c3aed 50%,
                #db2777 100%
            );

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            padding: 40px 20px;
        }


        /* Form Wrapper */

        .form-wrapper {
            width: 100%;

            max-width: 550px;
        }


        /* Job Edit Form */

        .job-post-form {
            background: #ffffff;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.2);
        }


        /* Heading */

        .job-post-form h2 {
            font-size: 2rem;

            color: #1e1b4b;

            margin-bottom: 5px;

            font-weight: 700;
        }


        .form-subtitle {
            color: #64748b;

            font-size: 0.95rem;

            margin-bottom: 30px;
        }


        /* Form Groups */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #334155;

            font-size: 0.9rem;
        }


        /* Inputs */

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            padding: 12px 15px;

            border: 2px solid #e2e8f0;

            border-radius: 10px;

            font-size: 1rem;

            font-family: inherit;

            background: #f8fafc;

            color: #1e293b;

            transition: all 0.3s ease;
        }


        .form-group textarea {

            resize: vertical;

            min-height: 130px;
        }


        /* Focus */

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            outline: none;

            border-color: #7c3aed;

            background: #ffffff;

            box-shadow:
                0 0 10px rgba(124, 58, 237, 0.15);
        }


        /* Two Inputs in One Row */

        .form-row {

            display: flex;

            gap: 15px;
        }


        .form-row .form-group {

            flex: 1;
        }


        /* Django Messages */

        .messages {

            margin-bottom: 20px;
        }


        .message {

            padding: 12px 15px;

            border-radius: 8px;

            font-size: 0.9rem;

            margin-bottom: 10px;
        }


        .message.success {

            background: #dcfce7;

            color: #166534;

            border: 1px solid #bbf7d0;
        }


        .message.error {

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;
        }


        .message.info {

            background: #dbeafe;

            color: #1e40af;

            border: 1px solid #bfdbfe;
        }


        /* Update Button */

        .submit-btn {

            width: 100%;

            background: linear-gradient(
                135deg,
                #4f46e5 0%,
                #7c3aed 100%
            );

            color: #ffffff;

            padding: 14px;

            font-size: 1.05rem;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            transition: all 0.3s ease;

            margin-top: 10px;

            box-shadow:
                0 4px 15px rgba(79, 70, 229, 0.4);
        }


        .submit-btn:hover {

            background: linear-gradient(
                135deg,
                #4338ca 0%,
                #6d28d9 100%
            );

            transform: translateY(-2px);

            box-shadow:
                0 6px 20px rgba(79, 70, 229, 0.6);
        }


        .submit-btn:active {

            transform: scale(0.98);
        }


        /* Back Button */

        .back-btn {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 12px;

            background: #f1f5f9;

            color: #475569;

            border-radius: 10px;

            text-align: center;

            text-decoration: none;

            font-size: 0.95rem;

            font-weight: 600;

            transition: 0.3s;
        }


        .back-btn:hover {

            background: #e2e8f0;

            color: #1e293b;
        }


        /* Mobile */

        @media (max-width: 480px) {

            body {

                padding: 25px 12px;
            }


            .job-post-form {

                padding: 25px 20px;
            }


            .job-post-form h2 {

                font-size: 1.7rem;
            }


            .form-row {

                flex-direction: column;

                gap: 0;
            }

        }

    </style>

</head>


<body>


<div class="form-wrapper">


    <form
        class="job-post-form"
        method="POST"
    >

        {% csrf_token %}


        <!-- Django Messages -->

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message
                        {% if message.tags == 'error' %}
                            error
                        {% elif message.tags == 'success' %}
                            success
                        {% else %}
                            info
                        {% endif %}
                    ">

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- Heading -->

        <h2>
            ✏️ Edit Job
        </h2>


        <p class="form-subtitle">
            Update the details of your job posting.
        </p>


        <!-- Job Title -->

        <div class="form-group">

            <label for="job-title">
                Job Title
            </label>

            <input
                type="text"
                id="job-title"
                name="title"
                value="{{ job.title }}"
                placeholder="e.g. Frontend Developer"
                required
            >

        </div>


        <!-- Company -->

        <div class="form-group">

            <label for="company-name">
                Company Name
            </label>

            <input
                type="text"
                id="company-name"
                name="company"
                value="{{ job.company }}"
                placeholder="e.g. Tech Corp"
                required
            >

        </div>


        <!-- Job Type & Last Date -->

        <div class="form-row">


            <div class="form-group">

                <label for="job-type">
                    Job Type
                </label>

                <select
                    id="job-type"
                    name="jobtype"
                    required
                >

                    <option
                        value=""
                        disabled
                    >
                        Select type
                    </option>

                    <option
                        value="full-time"
                        {% if job.jobtype == "full-time" %}
                            selected
                        {% endif %}
                    >
                        Full-Time
                    </option>

                    <option
                        value="part-time"
                        {% if job.jobtype == "part-time" %}
                            selected
                        {% endif %}
                    >
                        Part-Time
                    </option>

                    <option
                        value="contract"
                        {% if job.jobtype == "contract" %}
                            selected
                        {% endif %}
                    >
                        Contract
                    </option>

                    <option
                        value="internship"
                        {% if job.jobtype == "internship" %}
                            selected
                        {% endif %}
                    >
                        Internship
                    </option>

                    <option
                        value="remote"
                        {% if job.jobtype == "remote" %}
                            selected
                        {% endif %}
                    >
                        Remote
                    </option>

                </select>

            </div>


            <!-- Last Date -->

            <div class="form-group">

                <label for="last-date">
                    Last Date to Apply
                </label>

                <input
                    type="date"
                    id="last-date"
                    name="lastdate"
                    value="{{ job.lastdate|date:'Y-m-d' }}"
                    required
                >

            </div>

        </div>


        <!-- Location -->

        <div class="form-group">

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                name="location"
                value="{{ job.location }}"
                placeholder="e.g. Kochi, Kerala (Remote / Hybrid)"
                required
            >

        </div>


        <!-- Skills -->

        <div class="form-group">

            <label for="skills">
                Skills
            </label>

            <input
                type="text"
                id="skills"
                name="required_skills"
                value="{% for skill in job.required_skills.all %}{{ skill.name }}{% if not forloop.last %}, {% endif %}{% endfor %}"
                placeholder="e.g. HTML, CSS, JavaScript, React"
                required
            >

        </div>


        <!-- Experience & Education -->

        <div class="form-row">


            <div class="form-group">

                <label for="experience">
                    Experience
                </label>

                <input
                    type="text"
                    id="experience"
                    name="experience"
                    value="{{ job.experience }}"
                    placeholder="e.g. 2-4 Years"
                    required
                >

            </div>


            <div class="form-group">

                <label for="education">
                    Education
                </label>

                <input
                    type="text"
                    id="education"
                    name="education"
                    value="{{ job.education }}"
                    placeholder="e.g. Bachelor's Degree"
                    required
                >

            </div>

        </div>


        <!-- Salary -->

        <div class="form-group">

            <label for="salary">
                Salary
            </label>

            <input
                type="text"
                id="salary"
                name="salary"
                value="{{ job.salary }}"
                placeholder="e.g. ₹6,00,000 - ₹8,00,000 / year"
                required
            >

        </div>


        <!-- Description -->

        <div class="form-group">

            <label for="description">
                Job Description
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Provide a detailed description of the job role, responsibilities, and requirements..."
                required
            >{{ job.description }}</textarea>

        </div>


        <!-- Update Button -->

        <button
            type="submit"
            class="submit-btn"
        >
            💾 Update Job
        </button>


        <!-- Back Button -->

        <a
            href="{% url 'job_management' %}"
            class="back-btn"
        >
            ← Back to My Jobs
        </a>


    </form>


</div>


</body>

</html>
