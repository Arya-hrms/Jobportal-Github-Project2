<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Login - Job Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h2 {
      color: #1a1a1a;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .header p {
      color: #666666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333333;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #555;
      cursor: pointer;
    }

    .forgot-link {
      color: #007bff;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #0056b3;
    }

    .footer-text {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #666666;
    }

    .footer-text a {
      color: #007bff;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .alert-error {
      background-color: #f8d7da;
      color: #842029;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      border: 1px solid #f5c2c7;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header">
      <h2>Recruiter Login</h2>
      <p>Access your dashboard to post jobs and review applicants</p>
    </div>

    <!-- Optional message area for login errors -->
    {% if error_message %}
      <div class="alert-error">{{ error_message }}</div>
    {% endif %}

<form action="{% url 'login_recruiter' %}" method="POST">
  {% csrf_token %}

  {% if messages %}
    <div>
      {% for message in messages %}
        <div class="alert-error">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <div class="form-group">
    <label for="email">Work Email ID</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="name@company.com"
      required
      autocomplete="email"
    >
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter your password"
      required
      autocomplete="current-password"
    >
  </div>

  <div class="form-options">
    <label class="remember-me">
      <input type="checkbox" name="remember_me">
      Remember me
    </label>

    <a href="#" class="forgot-link">Forgot password?</a>
  </div>

  <button type="submit" class="submit-btn">
    Sign In
  </button>
</form>


    <div class="footer-text">
      Don't have a recruiter account? <a href="{% url 'register_recruiter' %}">Register here</a>
    </div>
  </div>

</body>
</html>
